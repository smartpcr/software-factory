server {
  listen 5181;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache fingerprinted assets aggressively, never cache index.html.
  location /assets/ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback — every non-asset path returns the bundle so React Router
  # can resolve it client-side.
  location / {
    try_files $uri /index.html;
  }
}
