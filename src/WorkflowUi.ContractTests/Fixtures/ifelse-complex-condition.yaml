workflowId: ifelse-complex-condition
workflowName: IfElse Complex Condition
nodes:
  - nodeId: ie1
    nodeName: Complex
    runtimeType: IfElse
    condition: "item.count > 0 && item.status == 'ready'"
  - nodeId: then1
    nodeName: Then
    runtimeType: Setter
  - nodeId: else1
    nodeName: Else
    runtimeType: Setter
connections:
  - sourceNodeId: ie1
    targetNodeId: then1
    triggerMessageType: Complete
    condition: "true"
  - sourceNodeId: ie1
    targetNodeId: else1
    triggerMessageType: Complete
    condition: "false"