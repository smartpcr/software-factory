# Label rules for PRs
'feat':
  - changed-files:
    - any-glob-to-any-file: 'src/**'
'docs':
  - changed-files:
    - any-glob-to-any-file: ['docs/**', '*.md']
'chore':
  - changed-files:
    - any-glob-to-any-file: ['.github/**', 'deploy/**', 'tools/**']
'fix':
  - changed-files:
    - any-glob-to-any-file: 'src/**'
