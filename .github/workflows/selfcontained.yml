name: Self-Contained Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            script: deploy/publish/publish-selfcontained.ps1
          - os: ubuntu-latest
            runtime: linux-x64
            script: deploy/publish/publish-selfcontained.sh

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ${{ matrix.script }} -Runtime ${{ matrix.runtime }}

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ${{ matrix.script }}
          bash ${{ matrix.script }} ${{ matrix.runtime }}

      - name: Sign executable (Windows)
        if: runner.os == 'Windows' && env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $exePath = "artifacts/publish/${{ matrix.runtime }}/WorkflowUi.Server.exe"
          & signtool sign /f $certPath /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exePath
          & signtool verify /pa $exePath
          Remove-Item $certPath -Force

      - name: Sign executable (Linux)
        if: runner.os == 'Linux' && env.SIGN_CERT_BASE64 != ''
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y osslsigncode
          CERT_PATH="$RUNNER_TEMP/codesign.pfx"
          echo "$SIGN_CERT_BASE64" | base64 -d > "$CERT_PATH"
          EXE_PATH="artifacts/publish/${{ matrix.runtime }}/WorkflowUi.Server"
          SIGNED_PATH="${EXE_PATH}.signed"
          osslsigncode sign \
            -pkcs12 "$CERT_PATH" \
            -pass "$SIGN_CERT_PASSWORD" \
            -h sha256 \
            -ts http://timestamp.digicert.com \
            -in "$EXE_PATH" \
            -out "$SIGNED_PATH"
          mv "$SIGNED_PATH" "$EXE_PATH"
          rm -f "$CERT_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-ui-${{ matrix.runtime }}
          path: artifacts/publish/${{ matrix.runtime }}/
