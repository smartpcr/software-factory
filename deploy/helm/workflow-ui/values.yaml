# Default values for workflow-ui
replicaCount: 1

image:
  repository: ghcr.io/smartpcr/workflow-ui
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: workflow-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Persistence
persistence:
  workflowsRoot: /data/workflows
  runsRoot: /data/runs

# Auth
auth:
  authority: ""
  audience: ""
  allowDevBypass: "false"

# Pod security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# Probes
probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10

# Logging
logging:
  consoleFormatterName: json
