apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-workflow-ui-config
  labels:
    app.kubernetes.io/name: workflow-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  WorkflowsRoot: {{ .Values.persistence.workflowsRoot | quote }}
  RunsRoot: {{ .Values.persistence.runsRoot | quote }}
  Auth__Authority: {{ .Values.auth.authority | quote }}
  Auth__Audience: {{ .Values.auth.audience | quote }}
  Logging__Console__FormatterName: {{ .Values.logging.consoleFormatterName | quote }}
